<!--Strip: link-->
<a class="strip strip--link" href="" target="_blank">
    <video class="strip__bg-video" autoplay loop muted playsinline preload="metadata"
        src=""></video>
    <div class="strip__gradient"></div>
    <div class="strip__text">
        <h2 class="strip__text--title"></h2>
        <p class="strip__text--desc"></p>
    </div>
    <span class="strip__icon">&#x25B6;</span>
</a>

<!--Strip: pop-up video-->
<div class="strip strip--link"
    data-src=""
    data-title=""
    data-desc="">
    <video class="strip__bg-video" autoplay loop muted playsinline preload="metadata"
        src=""></video>
    <div class="strip__gradient"></div>
    <div class="strip__text">
        <h2 class="strip__text--title"></h2>
        <p class="strip__text--desc"></p>
    </div>
    <span class="strip__icon">&#x25B6;</span>
</div>

<!--Overlay-->
<div class="overlay">
    <button class="overlay__close-btn" aria-label="Close">&#x2715;</button>
    <video class="overlay__video" controls playsinline preload="none"></video>
    <div class="overlay__metadata">
        <h2 class="overlay__metadata--title"></h2>
        <p class="overlay__metadata--desc"></p>
    </div>
</div>
